apiVersion: 1

providers:
  - name: 'platform-monitoring-poc'
    orgId: 1
    folder: 'Platform Monitoring POC'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false

  - name: 'component-types'
    orgId: 1
    folder: 'Component Types'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/component-types
      foldersFromFilesStructure: false
